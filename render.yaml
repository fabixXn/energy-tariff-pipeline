services:
  - type: web
    name: energy-tariff-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python src/run_pipeline.py && streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: energy-tariff-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: energy-tariff-db
    databaseName: energy_tariffs
    user: energy_user
    plan: free
